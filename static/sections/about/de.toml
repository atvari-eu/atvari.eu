"""
content = """
  ### Mit ❤️ für Rust, Nix & Open Source

  Wir helfen Teams dabei, sichere, skalierbare und leicht wartbare Systeme
  zu entwickeln und zu betreiben — mit Beratung in den Bereichen Software-
  & Cloud-Architektur, individuelle Softwareentwicklung, Cloud-Engineering
  und DevOps / Infrastructure-as-Code, mit besonderer Tiefe in Rust und dem
  Nix/NixOS-Ökosystem.

  Wir sind aktive Mitglieder der Open-Source-Community — unter anderem bei
  Nixpkgs, dem größten Open-Source-Paketarchiv — und legen großen Wert auf
  Systeme, die von Grund auf sicher und reproduzierbar sind.

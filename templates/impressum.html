{% extends "base.html" %}

{% block content %}
<header class="breadCrumb">
  <div class="container">
    <div class="row">
      <div class="col-lg-10 col-md-12 offset-lg-1 offset-md-0 text-center">
        <h3 class="breadCrumb__title">{{ section.title }}</h3>
        <nav aria-label="breadcrumb" class="d-flex justify-content-center">
          <ol class="breadcrumb align-items-center">
            <li class="breadcrumb-item"><a href="{{ get_url(path=config.base_url, lang=lang) }}">{{ trans(key="home", lang=lang) }}</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ section.title }}</li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</header>

<section class="section singleBlog">
  <div class="container">
    <div class="row mt-5">
      <div class="col-lg-10 offset-lg-1">
        <div class="contact-booking-card text-start singleBlog__content">
          {{ section.content | safe }}
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
